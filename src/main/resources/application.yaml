spring:
  application:
    name: instalflow
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: true
instalflow:
  bootstrap:
    owner-email: ${INSTALFLOW_BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${INSTALFLOW_BOOTSTRAP_OWNER_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
