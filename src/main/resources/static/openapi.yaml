openapi: 3.1.0
info:
  title: InstalFlow API
  version: 1.0.0
  description: |
    Implemented identity API. Account administration requires OWNER; the active technician
    directory permits OWNER and OFFICE and returns only the UUID and employee number.
    A user can read their own email through /auth/me. Passwords and password hashes never
    appear in responses. Email addresses are stripped, lowercased and remain reserved after
    deactivation. Employee numbers are decimal strings padded to at least four digits.

    Authentication uses a server-side JDBC session, with a 30 minute inactivity timeout.
    SESSION is HttpOnly and SameSite=Strict, and Secure in the default configuration;
    local and demo profiles allow HTTP by disabling Secure. Use HTTPS in production.
    Obtain CSRF before login, retain the rotated SESSION cookie after login, then obtain
    a fresh CSRF token. Every POST and PATCH, including login and logout, requires CSRF.
    Password, role and active status changes revoke the affected user's existing sessions.
    Login rate limits currently apply to a single application instance.

    All decimal values in future domain payloads use JSON strings, plain decimal notation
    without exponents. Quantities permit up to 3 fractional digits and money up to 2;
    DecimalValue alone defines the wire format, not those domain precision constraints.
    Time inputs use ISO 8601 with an explicit offset; outputs use UTC (Z).
    No pricing endpoints or pricing rules are implemented by this contract.
    Every response carries X-Request-Id, generated by the server; Problem.requestId
    carries the same UUID. Unsupported methods return 405 with code METHOD_NOT_ALLOWED.
    Problem.type may be omitted, which means about:blank under RFC 9457 section 3.1.1.
servers:
  - url: /
tags:
  - name: Authentication
  - name: Users
security:
  - session: []
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrf
      summary: Obtain a CSRF token and initialize an anonymous session if necessary
      security: []
      responses:
        '200':
          description: Token associated with the current session; retain any SESSION cookie
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfResponse'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate and rotate the session identifier
      description: Fetch /auth/csrf again after successful login before a subsequent mutation.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated user; retain the rotated SESSION cookie
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: INVALID_CREDENTIALS, including inactive accounts and malformed email addresses
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429':
          description: LOGIN_RATE_LIMITED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Read the authenticated user's own identity
      responses:
        '200':
          description: Current active user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Invalidate the authenticated session
      security:
        - session: []
          csrf: []
      responses:
        '204': {description: Session invalidated; no response body}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: OWNER lists all accounts, including inactive accounts
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: sort
          in: query
          schema: {type: string, enum: [employeeNumber, createdAt, email, role, active], default: employeeNumber}
        - {$ref: '#/components/parameters/Direction'}
      responses:
        '200':
          description: A page ordered by the requested field with ascending UUID as a stable tie breaker
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Users]
      operationId: createUser
      summary: OWNER creates an active account
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Account created
          headers:
            Location:
              description: Relative URI of the created account
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/users/technicians:
    get:
      tags: [Users]
      operationId: listTechnicians
      summary: OWNER or OFFICE lists active technicians without email addresses
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: sort
          in: query
          schema: {type: string, enum: [employeeNumber], default: employeeNumber}
        - {$ref: '#/components/parameters/Direction'}
      responses:
        '200':
          description: A page of active technicians ordered by employee number and ascending UUID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TechnicianPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/users/{id}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [Users]
      operationId: getUser
      summary: OWNER reads an account
      responses:
        '200':
          description: Requested account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Users]
      operationId: changeUserRole
      summary: OWNER changes an active account's role using its current version
      description: Cannot demote the last active OWNER. A real role change revokes the target's sessions.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeRoleRequest'}
      responses:
        '200':
          description: Updated account; an unchanged role leaves the version and sessions unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/users/{id}/password:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    post:
      tags: [Users]
      operationId: changeUserPassword
      summary: OWNER replaces an active account's password using its current version
      description: Revokes all sessions of the target account, including the caller's session when changing their own password.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: Password changed; no response body}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/users/{id}/deactivate:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: OWNER deactivates an active account using its current version
      description: Cannot deactivate the last active OWNER. Email stays reserved and all target sessions are revoked.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionRequest'}
      responses:
        '204': {description: Account deactivated; no response body}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  headers:
    RequestId:
      description: Server-generated request correlation UUID, also present in Problem.requestId
      schema: {type: string, format: uuid}
    SessionCookie:
      description: SESSION cookie, HttpOnly, SameSite=Strict and Secure by default; local/demo HTTP profiles disable Secure
      schema: {type: string}
  securitySchemes:
    session: {type: apiKey, in: cookie, name: SESSION, description: Server-side JDBC session cookie}
    csrf: {type: apiKey, in: header, name: X-CSRF-TOKEN, description: Token from GET /api/v1/auth/csrf for the current SESSION}
  parameters:
    UserId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Direction: {name: direction, in: query, description: Case insensitive, schema: {type: string, pattern: '^(?:[aA][sS][cC]|[dD][eE][sS][cC])$', default: asc}}
  responses:
    BadRequest:
      description: INVALID_REQUEST for malformed JSON, UUID, pagination or business input; VALIDATION_FAILED with violations for Bean Validation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: UNAUTHENTICATED; session absent, expired, revoked or account inactive
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: FORBIDDEN; insufficient role or missing/invalid CSRF (including anonymous mutations)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: USER_NOT_FOUND
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: EMAIL_ALREADY_USED, VERSION_CONFLICT, LAST_OWNER, INVALID_USER_STATE or CONFLICT for a database constraint/concurrent write
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE; JSON body required
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: INTERNAL_ERROR; details logged under requestId without exposing internal exception data
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Role: {type: string, enum: [OWNER, OFFICE, TECHNICIAN]}
    EmployeeNumber:
      type: string
      pattern: '^[0-9]{4,}$'
      description: Display identifier padded with leading zeros to at least four digits, never truncated
      example: '0001'
    DecimalValue:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
      description: Plain decimal JSON string; quantities require scale <= 3, money scale <= 2 in their domain schema
      example: '123.45'
    Timestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:[Zz]|[+-][0-9]{2}:[0-9]{2})$'
      description: ISO 8601 with explicit Z or HH:mm offset and at most 9 fractional digits on input; serialized in UTC with Z on output
      example: '2026-10-22T10:15:30Z'
    Version: {type: integer, format: int64, minimum: 0, example: 0}
    Password:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '\S'
      writeOnly: true
      description: Nonblank password of at most 128 Java UTF-16 code units; never returned
      example: 'Example-passphrase-123!'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, minLength: 1, maxLength: 1024, pattern: '\S', example: 'owner@example.com'}
        password: {$ref: '#/components/schemas/Password'}
      example: {email: owner@example.com, password: 'Example-passphrase-123!'}
    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          minLength: 1
          pattern: '\S'
          description: Stripped and lowercased; normalized length <= 254; exactly one @ with nonempty parts and no whitespace
        password: {$ref: '#/components/schemas/Password'}
        role: {$ref: '#/components/schemas/Role'}
      example: {email: technician@example.com, password: 'Example-passphrase-123!', role: TECHNICIAN}
    ChangeRoleRequest:
      type: object
      required: [role, version]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        version: {$ref: '#/components/schemas/Version'}
      example: {role: OFFICE, version: 0}
    ChangePasswordRequest:
      type: object
      required: [password, version]
      properties:
        password: {$ref: '#/components/schemas/Password'}
        version: {$ref: '#/components/schemas/Version'}
      example: {password: 'New-example-passphrase-123!', version: 1}
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: {$ref: '#/components/schemas/Version'}
      example: {version: 2}
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token: {type: string, minLength: 1}
        headerName: {type: string, const: X-CSRF-TOKEN}
      example: {token: example-csrf-token, headerName: X-CSRF-TOKEN}
    MeResponse:
      type: object
      additionalProperties: false
      required: [id, employeeNumber, email, role]
      properties:
        id: {type: string, format: uuid}
        employeeNumber: {$ref: '#/components/schemas/EmployeeNumber'}
        email: {type: string}
        role: {$ref: '#/components/schemas/Role'}
      example: {id: 'ec7bbce0-c246-4573-862c-1c7d7db2a71d', employeeNumber: '0001', email: owner@example.com, role: OWNER}
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, employeeNumber, email, role, active, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        employeeNumber: {$ref: '#/components/schemas/EmployeeNumber'}
        email: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        active: {type: boolean}
        version: {$ref: '#/components/schemas/Version'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
      example: {id: 'ec7bbce0-c246-4573-862c-1c7d7db2a71d', employeeNumber: '0002', email: technician@example.com, role: TECHNICIAN, active: true, version: 0, createdAt: '2026-10-22T10:15:30Z'}
    TechnicianResponse:
      type: object
      additionalProperties: false
      required: [id, employeeNumber]
      properties:
        id: {type: string, format: uuid}
        employeeNumber: {$ref: '#/components/schemas/EmployeeNumber'}
      example: {id: 'ec7bbce0-c246-4573-862c-1c7d7db2a71d', employeeNumber: '0002'}
    UserPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/UserResponse'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
      example: {content: [], page: 0, size: 20, totalElements: 0, totalPages: 0}
    TechnicianPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/TechnicianResponse'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
      example: {content: [], page: 0, size: 20, totalElements: 0, totalPages: 0}
    Problem:
      type: object
      required: [title, status, detail, instance, code, requestId]
      properties:
        type: {type: string, format: uri-reference, default: 'about:blank', description: Optional; absence means about:blank under RFC 9457 section 3.1.1}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code:
          type: string
          description: Existing application codes; framework 4xx errors use HttpStatus names, e.g. METHOD_NOT_ALLOWED or UNSUPPORTED_MEDIA_TYPE
          examples: [INVALID_REQUEST, VALIDATION_FAILED, UNAUTHENTICATED, INVALID_CREDENTIALS, FORBIDDEN, LOGIN_RATE_LIMITED, USER_NOT_FOUND, EMAIL_ALREADY_USED, VERSION_CONFLICT, LAST_OWNER, INVALID_USER_STATE, CONFLICT, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR]
        requestId: {type: string, format: uuid, description: Same UUID as the X-Request-Id response header}
        violations:
          type: array
          description: Present for VALIDATION_FAILED only
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
      example: {type: 'about:blank', title: Conflict, status: 409, detail: The resource version has changed, instance: /api/v1/users/ec7bbce0-c246-4573-862c-1c7d7db2a71d, code: VERSION_CONFLICT, requestId: '058cbd9b-f470-4f31-a4d5-a61af28407dc'}
